name: Build and Push Docker Image

on:
  release:
    types: [published] # 当发布新 Release 时自动执行
  workflow_dispatch:   # 允许通过 GitHub Actions 页面手动触发
    inputs:
      tag_name:
        description: 'Image tag to build (e.g., v20260204.2.0)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 使用 GitHub Secret 中的 DOCKERHUB_USERNAME 变量动态生成镜像名称
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/signal-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 如果是手动触发，签出指定的 tag/branch
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version-file: .java-version
          cache: 'maven'

      - name: Extract FoundationDB Version
        id: fdb_version
        run: |
          FDB_VERSION=$(grep -m 1 "image: foundationdb/foundationdb:" .github/workflows/test.yml | awk -F':' '{print $3}' | tr -d ' ' || echo "7.3.62")
          echo "FDB_VERSION=$FDB_VERSION" >> $GITHUB_ENV

      - name: Build with Maven
        run: |
          # 第一步：打包主程序 (在 exclude-spam-filter profile 下会生成 shade fat jar)
          ./mvnw -e -B clean package -DskipTests=true -Pexclude-spam-filter
          # 第二步：显式拷贝依赖到 target/lib 目录，以兼容旧版 Dockerfile 的依赖需求
          ./mvnw -e -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=service/target/lib -pl service
          # 重命名生成的 JAR 为 Dockerfile 期望的通用名称，以便于无缝构建
          if ls service/target/TextSecureServer-*.jar 1> /dev/null 2>&1; then
            mv service/target/TextSecureServer-*.jar service/target/Signal-Service.jar || true
          fi

      - name: Download FoundationDB client
        run: |
          # The package step of Signal-Server usually downloads the fdb client into service/target/jib-extra/usr/lib/
          # Ensure it exists or download manually
          mkdir -p service/target/jib-extra/usr/lib
          if [ ! -f "service/target/jib-extra/usr/lib/libfdb_c.x86_64.so" ] && [ ! -f "service/target/jib-extra/usr/lib/libfdb_c.so" ]; then
             echo "Downloading FDB client version $FDB_VERSION..."
             curl -L -o service/target/jib-extra/usr/lib/libfdb_c.so https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/libfdb_c.x86_64.so
          fi

      - name: Set up QEMU (for multi-arch builds if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "release" ]; then
            # github.event.release.tag_name 包含 release 的 tag
            echo "IMAGE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            # fallback
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            # 如果希望最新发布的 tag 也能同时被打上 latest 标签，可使用以下配置：
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            JAR_FILE=Signal-Service.jar
            CONFIG_FILE=sample.yml
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
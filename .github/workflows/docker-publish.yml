name: Build and Push Docker Image

on:
  release:
    types: [published] # 当发布新 Release 时自动执行
  workflow_dispatch:   # 允许通过 GitHub Actions 页面手动触发
    inputs:
      tag_name:
        description: 'Image tag to build (e.g., v20260204.2.0)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 使用 GitHub Secret 中的 DOCKERHUB_USERNAME 变量动态生成镜像名称
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/signal-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 如果是手动触发，签出指定的 tag/branch
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 1

      - name: Set up QEMU (for multi-arch builds if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "release" ]; then
            # github.event.release.tag_name 包含 release 的 tag
            echo "IMAGE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            # fallback
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            # 如果希望最新发布的 tag 也能同时被打上 latest 标签，可使用以下配置：
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
version: '3.8'

services:


  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    ports:
      - "7001:6379"
    restart: unless-stopped
    networks:
      - signal-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    ports:
      - "7002:6379"
    restart: unless-stopped
    networks:
      - signal-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    ports:
      - "7003:6379"
    restart: unless-stopped
    networks:
      - signal-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes

  redis-init:
    image: redis:7-alpine
    container_name: redis-init
    networks:
      - signal-network
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for Redis nodes to be ready...' &&
        sleep 15 &&
        echo 'Initializing Redis cluster...' &&
        redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 --cluster-replicas 0 --cluster-yes &&
        echo 'Redis cluster initialized successfully'
      "
    restart: "no"


  signal-server:
    image: docker.io/gaolixin622/signal-server:latest
    container_name: signal-server
    ports:
      - "8080:8080"
    volumes:
      - /Users/amber/Desktop/bison/signal/test-docker/gcp/google-account-key.json:/etc/gcp/google-account-key.json
      - ./service/config/sample.yml:/usr/share/signal/application.yml:ro
      - ./service/config/sample-secrets-bundle.yml:/usr/share/signal/secrets-bundle.yml:ro
      - heapdumps:/tmp
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/google-account-key.json
      - JAVA_OPTS=-server -Djava.awt.headless=true -Djdk.nio.maxCachedBufferSize=262144 -Dlog4j2.formatMsgNoLookups=true -XX:MaxRAMPercentage=75 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.bin

    restart: unless-stopped
    depends_on:
      redis-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c", "java $JAVA_OPTS -cp /app/classes:/app/lib/* -Dsecrets.bundle.filename=/usr/share/signal/secrets-bundle.yml org.whispersystems.textsecuregcm.WhisperServerService server /usr/share/signal/application.yml"]

    networks:
      - signal-network



volumes:
  redis-data:
  postgres-data:
  localstack-data:
  foundationdb-data:
  heapdumps:

networks:
  signal-network:
    driver: bridge